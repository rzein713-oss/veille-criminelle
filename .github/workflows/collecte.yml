name: Collecte quotidienne

on:
  schedule:
    - cron: "17 10 * * *"   # ~5 h 17 (heure de l'Est)
    - cron: "17 22 * * *"   # ~17 h 17 (heure de l'Est)
  workflow_dispatch:

permissions:
  contents: write
  models: read

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collecter les nouveaux éléments
        env:
          CANLII_API_KEY: ${{ secrets.CANLII_API_KEY }}
        run: |
          pip install --quiet "pypdf>=5,<7"
          python scripts/collect.py
      - name: Résumés clairs des décisions (GitHub Models, gratuit)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/resumer_gratuit.py
      - name: Résumés (seulement si la clé API est configurée)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "Aucune clé API : résumés désactivés."
            exit 0
          fi
          pip install --quiet "anthropic>=2.10,<3"
          python scripts/summarize.py
      - name: Publier s'il y a du nouveau
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "Rien de nouveau."
            exit 0
          fi
          git config user.name "veille-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git commit -m "Collecte du $(date -u +%Y-%m-%d)"
          git push
